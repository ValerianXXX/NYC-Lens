excluded_sources:
  google_places:
    status: BLOCKED_LICENSE
    reason: Bulk permanent storage is outside the approved local open-data scope.
  yelp:
    status: BLOCKED_LICENSE
    reason: No bulk archival permission was established.
  commercial_mobile_movement:
    status: BLOCKED_LICENSE
    reason: Vendor licensing, paid-report rights, retention, and privacy terms require user-led review before any adapter is activated.
  commercial_real_estate_vendors:
    status: BLOCKED_LICENSE
    reason: CoStar, CompStak, CREXi and Reonomy data require user-supplied contracts, credentials, archival and paid-report rights; no account, scrape, contact, download or purchase was attempted.
  regional_development_projects:
    status: INDETERMINATE_FRAGMENTED
    reason: No single authoritative CSA-wide project feed exists in scope; a gated local-file adapter is available for user-supplied official municipal datasets without treating absence as zero.
  nj_transit_gtfs:
    status: BLOCKED_CREDENTIALS
    reason: The official NJ TRANSIT developer portal requires an account and token, and its terms require user-led legal review before commercial reliance; no account was created and no data was downloaded.
  cttransit_gtfs:
