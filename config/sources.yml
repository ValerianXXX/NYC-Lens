version: "0.2.0"
sources:
  nyc_geoservice:
    name: NYC Geoservice / Geosupport
    steward: NYC Department of City Planning
    url: https://geoservice.planning.nyc.gov/
    api_url: https://geoservice.planning.nyc.gov/geoservice/geoservice.svc
    dataset_id: geosupport
    update_frequency: rolling
    geographic_precision: address, BBL, BIN
    temporal_precision: current service
    license: NYC public service terms; subscription key required
    estimated_size: API only
    incremental_method: query on demand
    last_successful_update: null
    known_limitations: Requires subscription key; public placeholder returned HTTP 401 on 2026-08-29.
  census_geocoder:
    name: U.S. Census Geocoder
    steward: U.S. Census Bureau
    url: https://geocoding.geo.census.gov/geocoder/
    api_url: https://geocoding.geo.census.gov/geocoder/geographies/onelineaddress
    dataset_id: census_geocoder_current
    update_frequency: service
    geographic_precision: matched address / coordinates / Census geography
    temporal_precision: current benchmark
    license: U.S. Government public data
    estimated_size: API only
    incremental_method: query on demand with local cache
    last_successful_update: null
    known_limitations: Official fallback does not return NYC BBL or BIN; parcel is added by spatial join.
  tiger_bg_2024:
    name: 2024 TIGER/Line Block Groups - Greater NYC states
    steward: U.S. Census Bureau
    url: https://www2.census.gov/geo/tiger/TIGER2024/BG/
    api_url: null
    dataset_id: tl_2024_09_34_36_42_bg
    update_frequency: annual
    geographic_precision: Census block group
    temporal_precision: boundaries as of 2024-01-01
    license: U.S. Government public data
    estimated_size: about 61 MB compressed across CT, NJ, NY and PA; locally filtered to the 30 CSA 408 county equivalents
    incremental_method: replace annual standardized layer; retain raw snapshots
    last_successful_update: null
    known_limitations: Boundary file contains no demographic measures.
  omb_2023_cbsa_delineation:
    name: 2023 Census/OMB Core Based Statistical Area Delineation File
    steward: U.S. Office of Management and Budget / U.S. Census Bureau
    url: https://www2.census.gov/programs-surveys/metro-micro/geographies/reference-files/2023/delineation-files/list1_2023.xlsx
    api_url: null
    dataset_id: list1_2023
    update_frequency: after OMB delineation revisions
    geographic_precision: county and county-equivalent membership in metropolitan, micropolitan and combined statistical areas
    temporal_precision: July 2023 delineation
    license: U.S. Government public data
    estimated_size: under 1 MB
    incremental_method: immutable-vintage snapshot; rebuild the region definition only after an official revision
    last_successful_update: null
    known_limitations: Defines statistical-area membership, not a market-performance boundary; Connecticut uses planning-region county equivalents.
  tiger_county_2024:
    name: 2024 TIGER/Line Counties and County Equivalents
    steward: U.S. Census Bureau
    url: https://www2.census.gov/geo/tiger/TIGER2024/COUNTY/tl_2024_us_county.zip
    api_url: null
    dataset_id: tl_2024_us_county
    update_frequency: annual
    geographic_precision: county and county equivalent
    temporal_precision: boundaries as of 2024-01-01
    license: U.S. Government public data
    estimated_size: about 80 MB compressed nationally; locally filtered to 30 CSA 408 county equivalents
    incremental_method: replace annual standardized layer; retain raw snapshots
    last_successful_update: null
    known_limitations: General-purpose statistical boundaries may include water and do not represent a commercial catchment.
  tiger_tract_2024:
    name: 2024 TIGER/Line Census Tracts - Greater NYC states
    steward: U.S. Census Bureau
    url: https://www2.census.gov/geo/tiger/TIGER2024/TRACT/
    api_url: null
    dataset_id: tl_2024_09_34_36_42_tract
    update_frequency: annual
    geographic_precision: Census tract
    temporal_precision: boundaries as of 2024-01-01
    license: U.S. Government public data
    estimated_size: about 34 MB compressed across CT, NJ, NY and PA; locally filtered to the 30 CSA 408 county equivalents
    incremental_method: replace annual standardized layer; retain raw snapshots
    last_successful_update: null
    known_limitations: Boundary file contains no demographic measures.
  acs_2024_5yr:
    name: 2020-2024 ACS 5-Year Detailed Tables
    steward: U.S. Census Bureau
    url: https://api.census.gov/data/2024/acs/acs5
    api_url: https://api.census.gov/data/2024/acs/acs5
    dataset_id: 2024_acs_acs5
    update_frequency: annual
    geographic_precision: block group where published; tract fallback for B05002 and C16001
    temporal_precision: 2020-2024 pooled survey period
    license: U.S. Government public data
    estimated_size: about 0.85 GB for the selected national table files; rows for the 30 CSA 408 county equivalents are filtered locally
    incremental_method: new vintage snapshot
    last_successful_update: null
    known_limitations: Survey estimates; margins of error mandatory; table availability differs by summary level; public API required a key during this build.
  census_decennial_2020_pl:
    name: 2020 Census P.L. 94-171 Redistricting Summary File - New York
    steward: U.S. Census Bureau
    url: https://www2.census.gov/programs-surveys/decennial/2020/data/01-Redistricting_File--PL_94-171/New_York/ny2020.pl.zip
    api_url: null
    dataset_id: ny2020_pl_94_171
    update_frequency: decennial
    geographic_precision: 2020 Census block
    temporal_precision: Census Day 2020-04-01
    license: U.S. Government public data
    estimated_size: 69 MB compressed data plus under 1 MB official field definitions
    incremental_method: immutable vintage snapshot; rebuild only if Census publishes a corrected file
    last_successful_update: null
    known_limitations: Disclosure-avoidance methods apply; local standardization keeps NYC shoreline-clipped blocks that exist in the official NYC planning boundary layer and stores no survey MOE because this is a decennial enumeration product.
  lodes_2023:
    name: LEHD Origin-Destination Employment Statistics 8
    steward: U.S. Census Bureau
    url: https://lehd.ces.census.gov/data/lodes/LODES8/
    api_url: null
    dataset_id: LODES8_CT_NJ_NY_PA_2023
    update_frequency: annual
    geographic_precision: 2020 Census block
    temporal_precision: 2023
    license: U.S. Government public data
    estimated_size: about 160 MB for S000 WAC/RAC, main/aux OD and crosswalk across CT, NJ, NY and PA
    incremental_method: new year snapshot
    last_successful_update: null
    known_limitations: Counts jobs and job flows, not necessarily distinct natural persons.
  mappluto_26v2:
    name: Primary Land Use Tax Lot Output / MapPLUTO
    steward: NYC Department of City Planning
    url: https://data.cityofnewyork.us/City-Government/Primary-Land-Use-Tax-Lot-Output-PLUTO-/64uk-42ks
    api_url: https://services5.arcgis.com/GfwWNkhOj9bNBqoJ/arcgis/rest/services/MAPPLUTO/FeatureServer/0/query
    dataset_id: 64uk-42ks
    update_frequency: multiple releases per year
    geographic_precision: tax lot; geometry supplied by official MapPLUTO service/download
    temporal_precision: 26v2
    license: NYC Open Data Terms of Use and DCP use limitations
    estimated_size: about 1.4 GB published service size; about 1.9 GB as partitioned non-personal GeoJSON
    incremental_method: replace citywide standardized layer when the official service edit timestamp changes; retain partitioned raw snapshots
    last_successful_update: null
    known_limitations: Informational use; some condominium and unmapped lots need special handling; OwnerName is intentionally excluded from the local mirror under the project privacy rules.
  nyc_building_footprints:
    name: NYC Building Footprints
    steward: NYC Office of Technology and Innovation
    url: https://data.cityofnewyork.us/City-Government/BUILDING/5zhs-2jue
    api_url: https://data.cityofnewyork.us/resource/5zhs-2jue.geojson
    dataset_id: 5zhs-2jue
    update_frequency: weekly
    geographic_precision: building footprint
    temporal_precision: current published snapshot
    license: NYC Open Data Terms of Use
    estimated_size: about 0.9 GB as partitioned citywide GeoJSON
    incremental_method: replace citywide standardized layer when dataset update timestamp changes; retain raw snapshots
    last_successful_update: null
    known_limitations: BIN may be unassigned for some footprints; building names are sparsely populated and not actively maintained.
  nyc_census_blocks_2020:
    name: NYC 2020 Census Blocks
    steward: NYC Department of City Planning
    url: https://data.cityofnewyork.us/City-Government/2020-Census-Blocks/wmsu-5muw
    api_url: https://data.cityofnewyork.us/resource/wmsu-5muw.geojson
    dataset_id: wmsu-5muw
    update_frequency: quarterly publication check
    geographic_precision: 2020 Census block
    temporal_precision: 2020 geography
    license: NYC Open Data Terms of Use; underlying U.S. Census geography
    estimated_size: under 250 MB
    incremental_method: replace published boundary layer; retain raw snapshots
    last_successful_update: null
    known_limitations: Shoreline-clipped NYC planning geography; not a demographic fact table.
  nyc_census_tracts_2020:
    name: NYC 2020 Census Tracts
    steward: NYC Department of City Planning
    url: https://data.cityofnewyork.us/City-Government/2020-Census-Tracts/63ge-mke6
    api_url: https://data.cityofnewyork.us/resource/63ge-mke6.geojson
    dataset_id: 63ge-mke6
    update_frequency: quarterly publication check
    geographic_precision: 2020 Census tract
    temporal_precision: 2020 geography
    license: NYC Open Data Terms of Use; underlying U.S. Census geography
    estimated_size: under 100 MB
    incremental_method: replace published boundary layer; retain raw snapshots
    last_successful_update: null
    known_limitations: Boundary geometry contains no demographic measures.
  nyc_nta_2020:
    name: NYC 2020 Neighborhood Tabulation Areas
    steward: NYC Department of City Planning
    url: https://data.cityofnewyork.us/City-Government/2020-Neighborhood-Tabulation-Areas-NTAs-/9nt8-h7nd
    api_url: https://data.cityofnewyork.us/resource/9nt8-h7nd.geojson
    dataset_id: 9nt8-h7nd
    update_frequency: quarterly
    geographic_precision: NTA
    temporal_precision: 2020 geography
    license: NYC Open Data Terms of Use
    estimated_size: under 50 MB
    incremental_method: replace published boundary layer; retain raw snapshots
    last_successful_update: null
    known_limitations: Statistical reporting geography; includes non-residential special-area types.
  nyc_cdta_2020:
    name: NYC 2020 Community District Tabulation Areas
    steward: NYC Department of City Planning
    url: https://data.cityofnewyork.us/City-Government/2020-Community-District-Tabulation-Areas-CDTAs/xn3r-zk6y
    api_url: https://data.cityofnewyork.us/resource/xn3r-zk6y.geojson
    dataset_id: xn3r-zk6y
    update_frequency: quarterly
    geographic_precision: CDTA
    temporal_precision: 2020 geography
    license: NYC Open Data Terms of Use
    estimated_size: under 25 MB
    incremental_method: replace published boundary layer; retain raw snapshots
    last_successful_update: null
    known_limitations: Approximates Community Districts for ACS reporting and is not identical to every administrative boundary.
  nyc_community_districts:
    name: NYC Community Districts
    steward: NYC Department of City Planning
    url: https://data.cityofnewyork.us/City-Government/Community-Districts/6ak9-vek3
    api_url: https://data.cityofnewyork.us/resource/6ak9-vek3.geojson
    dataset_id: 6ak9-vek3
    update_frequency: quarterly
    geographic_precision: community district and joint interest area
    temporal_precision: current published boundary
    license: NYC Open Data Terms of Use
    estimated_size: under 25 MB
    incremental_method: replace published boundary layer; retain raw snapshots
    last_successful_update: null
    known_limitations: Includes 59 districts and 12 joint interest areas; JIAs are not community districts.
  nyc_borough_boundaries:
    name: NYC Borough Boundaries
    steward: NYC Department of City Planning
    url: https://data.cityofnewyork.us/City-Government/Borough-Boundaries/gthc-hcne
    api_url: https://data.cityofnewyork.us/resource/gthc-hcne.geojson
    dataset_id: gthc-hcne
    update_frequency: quarterly
    geographic_precision: borough / county
    temporal_precision: current published boundary
    license: NYC Open Data Terms of Use
    estimated_size: under 10 MB
    incremental_method: replace published boundary layer; retain raw snapshots
    last_successful_update: null
    known_limitations: Shoreline-clipped land boundaries; county records are derived aliases of the five borough geometries.
  census_zcta_2020:
    name: 2020 Census ZIP Code Tabulation Areas via TIGERweb
    steward: U.S. Census Bureau
    url: https://tigerweb.geo.census.gov/tigerwebmain/TIGERweb_restmapservice.html
    api_url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/PUMA_TAD_TAZ_UGA_ZCTA/MapServer/1/query
    dataset_id: TIGERweb_2020_ZCTA
    update_frequency: service release
    geographic_precision: ZCTA
    temporal_precision: 2020 Census geography
    license: U.S. Government public data
    estimated_size: under 25 MB for the NYC intersecting extract
    incremental_method: replace bounded NYC extract when TIGERweb vintage changes; retain raw snapshots
    last_successful_update: null
    known_limitations: ZCTAs are Census statistical approximations of ZIP delivery areas and are not USPS ZIP boundaries.
  derived_h3_grid:
    name: NYC H3 Resolution 10 Analysis Grid
    steward: NYC Lens derived from official borough boundaries using H3
    url: https://h3geo.org/
    api_url: null
    dataset_id: nyc_h3_r10
    update_frequency: when borough geometry or H3 method changes
    geographic_precision: H3 resolution 10
    temporal_precision: derived snapshot
    license: H3 Apache-2.0; source boundary license retained through lineage
    estimated_size: under 100 MB
    incremental_method: deterministic rebuild from the latest local borough boundary snapshot
    last_successful_update: null
    known_limitations: Model grid cells do not follow administrative boundaries and edge cells intersect NYC only partially.
  derived_citywide_benchmark:
    name: NYC Lens Citywide Radial Benchmark
    steward: NYC Lens derived from locally versioned public datasets
    url: https://h3geo.org/
    api_url: null
    dataset_id: nyc_radial_benchmark_v1
    update_frequency: after relevant source refreshes
    geographic_precision: deterministic H3 resolution 10 center sample, stratified by borough
    temporal_precision: mixed source snapshots recorded per run
    license: Derived analysis; each component retains its upstream source license and snapshot
    estimated_size: under 100 MB
    incremental_method: deterministic full rebuild when the snapshot set or method changes
    last_successful_update: null
    known_limitations: Benchmarks cover 250m, 500m and 1km radial catchments only; they are empirical spatial reference distributions, not calibrated site scores.
  nysla_active_licenses:
    name: Current Liquor Authority Active Licenses - NYC extract
    steward: New York State Liquor Authority / Alcoholic Beverage Control
    url: https://data.ny.gov/Economic-Development/Current-Liquor-Authority-Active-Licenses/9s3h-dpkz
    api_url: https://data.ny.gov/resource/9s3h-dpkz.csv
    dataset_id: 9s3h-dpkz
    update_frequency: daily
    geographic_precision: licensed premises point where geocoded by the publisher
    temporal_precision: current active license and permit inventory
    license: License unspecified in NY Open Data portal; attribution and source terms retained
    estimated_size: under 20 MB for selected non-personal fields in the five NYC counties
    incremental_method: replace NYC active-license extract; retain raw snapshots
    last_successful_update: null
    known_limitations: The source is an active inventory rather than a history; the local extract intentionally excludes legal names and all fields not needed for site analysis.
  nyc_str_registration:
    name: NYC Short-Term Rental Registration Dataset
    steward: NYC Mayor's Office of Special Enforcement
    url: https://www.nyc.gov/site/specialenforcement/registration-law/registration-and-listing-data.page
    api_url: https://www.nyc.gov/assets/specialenforcement/downloads/excel/January_7_2026_STR_Registration_Dataset.xlsx
    dataset_id: ose_str_registration_2026_01_07
    update_frequency: periodic
    geographic_precision: registered dwelling unit in source; standardized locally to building point
    temporal_precision: status as of 2026-01-07
    license: Official NYC.gov public release and NYC website Terms of Use
    estimated_size: under 1 MB
    incremental_method: replace published registration inventory when report link changes; retain raw snapshots
    last_successful_update: null
    known_limitations: Latest published report found is dated 2026-01-07; unit numbers, booking-service names, and listing identifiers are excluded from the standardized layer, and a registration does not prove every stay is lawful.
  nyc_facilities:
    name: NYC City Planning Facilities Database
    steward: NYC Department of City Planning
    url: https://data.cityofnewyork.us/City-Government/Facilities-Database/ji82-xba5
    api_url: https://data.cityofnewyork.us/resource/ji82-xba5.csv
    dataset_id: ji82-xba5
    update_frequency: at least quarterly where upstream sources permit
    geographic_precision: facility or program-site point
    temporal_precision: current compiled publication
    license: NYC Open Data Terms of Use; upstream source attribution retained in each record
    estimated_size: under 50 MB
    incremental_method: replace citywide compiled facility layer; retain raw snapshots
    last_successful_update: null
    known_limitations: Compiles many upstream systems with different update cycles; co-located services may represent separate programs and capacity fields are not comparable across types.
  dohmh_restaurants:
    name: DOHMH New York City Restaurant Inspection Results
    steward: NYC Department of Health and Mental Hygiene
    url: https://data.cityofnewyork.us/resource/43nn-pn8j.csv
    api_url: https://data.cityofnewyork.us/resource/43nn-pn8j.csv
    dataset_id: 43nn-pn8j
    update_frequency: daily
    geographic_precision: establishment point where coordinates are present
    temporal_precision: inspection date; active-establishment extract
    license: NYC Open Data Terms of Use
    estimated_size: under 200 MB citywide CSV
    incremental_method: full snapshot then inspection_date watermark
    last_successful_update: null
    known_limitations: Multiple violation rows per inspection; 1900-01-01 means not yet inspected.
  overture_places:
    name: Overture Maps Places
    steward: Overture Maps Foundation
    url: https://docs.overturemaps.org/guides/places/
    api_url: https://stac.overturemaps.org/catalog.json
    dataset_id: overture_places_latest
    update_frequency: monthly
    geographic_precision: place point
    temporal_precision: release vintage
    license: Per-source attribution; principally CDLA-Permissive-2.0, Apache-2.0 and CC0; retain source fields and NOTICE
    estimated_size: expected under 2 GB for the configured Greater NYC bounding-box GeoParquet extract
    incremental_method: current release spatial extract; retain release and source arrays
    last_successful_update: null
    known_limitations: Mixed upstream freshness and confidence; public releases retained for a limited time.
  overture_buildings:
    name: Overture Maps Building Footprints
    steward: Overture Maps Foundation
    url: https://docs.overturemaps.org/guides/buildings/
    api_url: https://stac.overturemaps.org/catalog.json
    dataset_id: overture_buildings_latest
    update_frequency: monthly
    geographic_precision: building footprint
    temporal_precision: release vintage
    license: Overture Buildings theme ODbL-1.0; retain upstream source arrays and required attribution
    estimated_size: expected under 2 GB for the configured Greater NYC bounding-box GeoParquet extract
    incremental_method: current release spatial extract into external Parquet storage; retain release and source arrays
    last_successful_update: null
    known_limitations: Coverage and attributes vary by upstream provider; footprints are not authoritative parcels and may overlap NYC authoritative building footprints.
  mta_gtfs_static:
    name: MTA New York City Transit Subway GTFS
    steward: Metropolitan Transportation Authority
    url: https://www.mta.info/developers
    api_url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_subway.zip
    dataset_id: gtfs_subway
    update_frequency: periodic
    geographic_precision: stop and scheduled trip
    temporal_precision: current schedule feed
    license: MTA Developer Resources Terms
    estimated_size: under 50 MB
    incremental_method: replace current standardized feed; retain raw snapshots
    last_successful_update: null
    known_limitations: Static schedule is not observed service.
  regional_mta_rail_gtfs_static:
    name: MTA Long Island Rail Road and Metro-North Railroad GTFS
    steward: Metropolitan Transportation Authority
    url: https://www.mta.info/developers
    api_url: https://rrgtfsfeeds.s3.amazonaws.com/
    dataset_id: gtfslirr_and_gtfsmnr
    update_frequency: frequent current-timetable updates
    geographic_precision: parent station point and scheduled route association
    temporal_precision: current schedule feed
    license: MTA Developer Resources Terms; data feeds are free to use; no MTA logos, maps, symbols, or other brand assets retained
    estimated_size: under 100 MB across two ZIP feeds
    incremental_method: replace current standardized station inventory; retain every Raw ZIP snapshot and hash
    last_successful_update: null
    known_limitations: Static schedules are not observed service or ridership; MTA states Port Jervis and Pascack Valley schedules are in the separately restricted NJ TRANSIT feed and are therefore not included here.
    feeds:
      - key: lirr
        mode: commuter_rail
        url: https://rrgtfsfeeds.s3.amazonaws.com/gtfslirr.zip
      - key: mnr
        mode: commuter_rail
        url: https://rrgtfsfeeds.s3.amazonaws.com/gtfsmnr.zip
  mta_bus_gtfs_static:
    name: MTA New York City Bus GTFS - six current schedule feeds
    steward: Metropolitan Transportation Authority
    url: https://www.mta.info/developers
    api_url: https://rrgtfsfeeds.s3.amazonaws.com/
    dataset_id: gtfs_bus_six_feeds
    update_frequency: quarterly
    geographic_precision: scheduled bus stop
    temporal_precision: current quarterly schedule
    license: MTA Developer Resources Terms
    estimated_size: under 150 MB across the six current ZIP feeds
    incremental_method: replace current standardized stops and route associations; retain all six Raw ZIP snapshots
    last_successful_update: null
    known_limitations: Static schedules omit most temporary detours and do not represent observed service; borough feed labels have documented route exceptions.
    feeds:
      - key: bronx
        borough: Bronx
        url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_bx.zip
      - key: brooklyn
        borough: Brooklyn
        url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_b.zip
      - key: manhattan
        borough: Manhattan
        url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_m.zip
      - key: queens
        borough: Queens
        url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_q.zip
      - key: staten_island
        borough: Staten Island
        url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_si.zip
      - key: mta_bus_company
        borough: Multiple
        url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_busco.zip
  mta_realtime_feed_catalog:
    name: MTA GTFS Realtime public feed catalog metadata
    steward: Metropolitan Transportation Authority
    url: https://www.mta.info/developers
    api_url: https://raw.githubusercontent.com/nymta/gtfs-documentation/main/README.md
    dataset_id: mta_gtfs_realtime_catalog
    update_frequency: periodic documentation check
    geographic_precision: feed metadata only
    temporal_precision: retrieval time
    license: MTA Developer Resources Terms
    estimated_size: under 1 MB
    incremental_method: retain the MTA-linked official GTFS documentation snapshot and a versioned local endpoint catalog
    last_successful_update: null
    known_limitations: Metadata is not a service-performance observation; endpoint availability can change between snapshots.
  mta_bus_realtime:
    name: MTA Bus Time realtime API access status
    steward: Metropolitan Transportation Authority
    url: https://www.mta.info/developers
    api_url: https://bustime.mta.info/wiki/Developers/Index
    dataset_id: mta_bus_time_api
    update_frequency: realtime when credentials are operator-provided
    geographic_precision: vehicle, trip and stop depending on endpoint
    temporal_precision: realtime
    license: MTA Bus Time API terms
    estimated_size: no payload downloaded without an operator-provided API key
    incremental_method: credentials gate; never create an account automatically
    last_successful_update: null
    known_limitations: MTA states that Bus Time APIs require an account and API key; NYC Lens records BLOCKED_CREDENTIALS when none is supplied.
  citibike_gbfs_current:
    name: Citi Bike GBFS current station information and station status
    steward: Citi Bike / Lyft
    url: https://citibikenyc.com/system-data
    api_url: https://gbfs.citibikenyc.com/gbfs/2.3/gbfs.json
    dataset_id: citibike_gbfs_2_3
    update_frequency: realtime feed; local refresh is operator-triggered
    geographic_precision: bike-share station point
    temporal_precision: feed retrieval and station last-reported timestamp
    license: NYCBS Data Use Policy; attribution retained
    estimated_size: under 5 MB for root, system, station-information and station-status snapshots
    incremental_method: replace current station and station-status standard layer; retain Raw JSON snapshots
    last_successful_update: null
    known_limitations: Availability is a point-in-time operational state and can change within seconds; stations include the regional Citi Bike system, including New Jersey locations.
  citibike_monthly_operating_report:
    name: Citi Bike Monthly Operating Report - latest published report
    steward: Citi Bike / Lyft, provided to NYC Department of Transportation
    url: https://citibikenyc.com/system-data/operating-reports
    api_url: https://citibikenyc.com/system-data/operating-reports
    dataset_id: citibike_monthly_operating_report
    update_frequency: monthly
    geographic_precision: system-wide aggregate
    temporal_precision: calendar month
    license: Citi Bike published operating report and NYCBS Data Use Policy; attribution retained
    estimated_size: under 5 MB for index HTML and latest PDF
    incremental_method: discover latest linked PDF, retain Raw page and PDF, replace current system-level aggregate metrics
    last_successful_update: null
    known_limitations: System-wide operating metrics cannot be attributed to a neighborhood, station, trip, rider or individual; revenue figures are preliminary and unaudited where the report says so.
  mta_subway_stations:
    name: MTA Subway Stations
