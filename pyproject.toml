[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-lens"
version = "0.2.0"
description = "Auditable local NYC trade-area and commercial-intelligence database"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Source-available; all rights reserved; upstream datasets retain their own licenses"}
dependencies = [
  "duckdb>=1.3,<2",
  "fastapi>=0.115,<1",
  "geopandas>=1.0,<2",
  "h3>=4.1,<5",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "networkx>=3.4,<4",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyarrow>=18,<23",
  "pypdf>=5,<7",
  "pydantic>=2.10,<3",
  "pyproj>=3.7,<4",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
  "shapely>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]

[project.scripts]
nyc-lens = "nyc_lens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nyc_lens = ["schema.sql", "reporting/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: exercises the populated local database without external network access",
]

[tool.coverage.run]
source = ["nyc_lens"]
